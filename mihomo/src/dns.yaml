dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  use-hosts: true
  use-system-hosts: true

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.ntp.org"

  # 只负责解析 DoH 服务器自身的域名，使用加密 DNS
  default-nameserver:
    - "tls://223.5.5.5"
    - "tls://223.6.6.6"

  # 代理节点域名必须先通过直连 DNS 解析，避免循环依赖
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"

  # 默认/国外域名：连接遵守代理规则
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"

  # 最终走 DIRECT 的域名：使用国内加密 DNS
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"

  direct-nameserver-follow-policy: false

  # 提前保证国内域名使用国内 DNS，改善 CDN 调度
  nameserver-policy:
    "geosite:cn":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"